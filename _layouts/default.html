<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != 'home' %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="layout-{{ page.layout | default: 'page' }}">
    <main class="terminal-shell">
      {{ content }}
    </main>
    {% if page.layout == 'post' %}
      <script src="{{ '/assets/js/typewriter.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
